name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation or problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Spyglass to do?
      description: A shortcut, a setting, a new scope, a different behaviour - whatever you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
      description: How do you do this today, in Spyglass or with something else (VS Code search, Telescope, JetBrains Search Everywhere)?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would be willing to work on this myself
