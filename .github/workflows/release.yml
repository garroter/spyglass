name: Release

# Push a tag such as v0.3.0 (after bumping "version" in package.json and giving CHANGELOG.md a
# "## [0.3.0]" section). This checks that, runs the CI checks, publishes a GitHub Release with the .vsix
# that passed them, and publishes that same .vsix to the VS Code Marketplace and to Open VSX (which
# VSCodium, Cursor and Code - OSS install from). Each store needs a token in the repository secrets -
# VSCE_PAT (Azure DevOps, Marketplace: Manage) and OVSX_PAT (open-vsx.org) - and is skipped, with a
# notice, while its token is missing. Pre-releases (v1.2.3-beta.1) only get the GitHub Release.
# Note: VSCE_PAT has to be a global Azure DevOps PAT ("All accessible organizations"), a kind Microsoft
# is retiring (2026-12-01) and no longer lets you create; the replacement is Microsoft Entra ID
# (vsce publish --azure-credential). Until that is set up the Marketplace is published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The tag matches the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - name: CHANGELOG.md has notes for this version
        run: node scripts/changelog.mjs "$GITHUB_REF_NAME" > /dev/null

  checks:
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: spyglass-vsix
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/changelog.mjs "$version" > release-notes.md
          mv dist/spyglass.vsix "dist/spyglass-${version}.vsix"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/spyglass-${version}.vsix" \
            --title "Spyglass ${version}" \
            --notes-file release-notes.md \
            $prerelease

      # The stores are independent: a failure in one still lets the other publish.
      - name: Publish to the VS Code Marketplace
        if: ${{ !cancelled() && !contains(github.ref_name, '-') }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice::VSCE_PAT is not set - not publishing to the Marketplace"; exit 0; fi
          npx --yes @vscode/vsce@3.2.1 publish --packagePath "dist/spyglass-${GITHUB_REF_NAME#v}.vsix" --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: ${{ !cancelled() && !contains(github.ref_name, '-') }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::notice::OVSX_PAT is not set - not publishing to Open VSX"; exit 0; fi
          npx --yes ovsx@0.10.1 publish "dist/spyglass-${GITHUB_REF_NAME#v}.vsix" --pat "$OVSX_PAT"
